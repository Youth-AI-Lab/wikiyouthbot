<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission de la semaine · WikiYouthBot</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,8 62,38 94,40 68,60 76,92 50,72 24,92 32,60 6,40 38,38' fill='%23f9c724' stroke='%23f37030' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a22; --bg2:#0a1030; --panel:#132049; --panel2:#0f1a3e; --edge:#2b3d7e; --edge2:#42579e;
    --ink:#f3f6ff; --soft:#b3c0ec; --faint:#7180bb;
    --orange:#f37030; --blue:#38b6ff; --pink:#fa89d2; --yellow:#f9c724; --green:#7ed957; --purple:#9b6cff;
    --good:#7ed957; --wax:#d33f3f; --grid:rgba(120,160,255,.07);
    --display:"Bungee Inline","Outfit",system-ui,sans-serif;
    --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html{font-size:15px}
  html,body{height:100%}
  body{margin:0; font-family:var(--sans); color:var(--ink); line-height:1.42; overflow:hidden;
    background:
      radial-gradient(45vw 42vh at 100% -8%, color-mix(in srgb,var(--orange) 11%, transparent), transparent 62%),
      radial-gradient(40vw 40vh at -6% 106%, color-mix(in srgb,var(--pink) 8%, transparent), transparent 62%),
      linear-gradient(var(--bg),var(--bg2))}
  body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:linear-gradient(var(--grid) 1px,transparent 1px), linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:34px 34px}

  .app{position:relative; z-index:1; height:100dvh; display:flex; flex-direction:column; overflow:hidden}
    .topbar{flex:none; background:#f3f5fb}
  .topbar-in{max-width:1320px; margin:0 auto; padding:.7rem 1.4rem; display:flex; align-items:center; justify-content:space-between; gap:1.2rem}
  .topbar .bigmission{color:#0f1533}
  .topbar .eyebrow{color:#5b6685}
  .topbar .classif{color:#c23e79}
  .topbar .classif .dot{background:#c23e79; box-shadow:0 0 6px #c23e79}
  .bhead{min-width:0}
    .topbar .classif{margin-top:0}
    .topbar .eyebrow{margin:.35rem 0 .2rem}
    .topbar .bigmission{font-size:clamp(1.15rem,2.4vw,1.6rem)}
    .topbar .charge{flex:none; align-self:center}
  .neon-sep{flex:none; height:4px; width:100%; margin:0; background:linear-gradient(90deg,var(--orange),var(--pink),var(--purple),var(--blue),var(--green),var(--yellow)); box-shadow:0 0 16px color-mix(in srgb,var(--blue) 55%,transparent), 0 2px 8px color-mix(in srgb,var(--pink) 45%,transparent)}
    .stage-wrap{flex:1; min-height:0; overflow:hidden}
  .content{max-width:1320px; height:100%; margin:0 auto; padding:.9rem 1.4rem; min-height:0; display:grid; grid-template-columns:300px 1fr; gap:.9rem}
  @media (max-width:860px){body{overflow:auto} .app{height:auto; min-height:100dvh} .stage-wrap{overflow:visible} .topbar-in{flex-wrap:wrap} .content{grid-template-columns:1fr; height:auto}}

  /* ---------- SIDEBAR ---------- */
  .side{display:flex; flex-direction:column; gap:.7rem; min-height:0}
  .wordmark{font-family:var(--display); font-size:1.35rem; letter-spacing:.01em; line-height:1; color:var(--ink)}
  .wordmark b{color:var(--yellow)} .wordmark i{font-style:normal; color:var(--orange)}
  .classif{display:flex; align-items:center; gap:.45rem; font-family:var(--mono); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:var(--pink); font-weight:700; margin-top:.4rem}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--pink); box-shadow:0 0 8px var(--pink); animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .tag{margin:.3rem 0 0; color:var(--soft); font-size:.8rem}
  .eyebrow{font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); margin:.5rem 0 .2rem; font-weight:700}
  .bigmission{font-family:var(--sans); font-weight:800; letter-spacing:-.01em; font-size:1.22rem; line-height:1.12; margin:0; color:#ffffff}
  .stip{font-size:.82rem; font-style:italic; color:var(--soft); margin-top:.4rem; padding-left:.6rem; border-left:2px solid color-mix(in srgb,var(--ac) 45%, transparent)}
  .stip b{color:var(--soft)}
  /* animation de fin */
  .celebrate{position:fixed; inset:0; z-index:50; display:none; place-items:center; background:color-mix(in srgb,var(--bg) 82%, transparent); backdrop-filter:blur(4px)}
  .celebrate.show{display:grid; animation:fade .4s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cele-card{--ac:var(--green); position:relative; text-align:center; background:linear-gradient(180deg,var(--panel),var(--panel2)); border:3px solid var(--ac); border-radius:22px; padding:1.8rem 2.4rem; box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px color-mix(in srgb,var(--ac) 30%,transparent); animation:pop .5s cubic-bezier(.2,1.5,.35,1) both}
  @keyframes pop{from{transform:scale(.7); opacity:0}to{transform:scale(1); opacity:1}}
  .cele-card .big{font-family:var(--display); font-size:clamp(1.3rem,3vw,2rem); color:#ffffff; line-height:1.1}
  .celestar{font-size:2.6rem; line-height:1; color:var(--ac)}
  .cele-card .sub{color:var(--soft); margin-top:.5rem; font-size:.95rem}
  .cele-card .cbot{width:70px; height:92px; margin-bottom:.4rem}
  .cele-card .btn{margin-top:1.1rem}
  .confetti{position:absolute; top:-26px; width:24px; height:24px; opacity:.95; animation:fall linear forwards}
  .confetti svg{width:100%; height:100%; filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  @keyframes fall{to{transform:translateY(60vh) rotate(540deg); opacity:0}}

  .charge{position:relative; overflow:hidden; display:flex; align-items:center; gap:.8rem; background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2.5px solid var(--green); border-radius:16px; padding:.6rem .85rem}
  .charge::after{content:""; position:absolute; left:0; right:0; top:0; height:30px; background:linear-gradient(180deg, color-mix(in srgb,var(--green) 40%,transparent), transparent); mix-blend-mode:screen; animation:scan 3.2s ease-in-out infinite}
  @keyframes scan{0%{transform:translateY(-36px)}50%{transform:translateY(78px)}100%{transform:translateY(-36px)}}
  .charge svg{width:40px; height:52px; flex:none; z-index:1}
  .cb .ghost *{fill:none; stroke:var(--edge2); stroke-width:3}
  .cb .full .body{fill:url(#g)} .cb .full .scr{fill:#06122e} .cb .full .eye{fill:#eafff2} .cb .full .lim{fill:var(--green)} .cb .full .mo{stroke:#06122e; stroke-width:2.4; fill:none}
  #fr{transition:y .55s cubic-bezier(.2,.9,.2,1), height .55s cubic-bezier(.2,.9,.2,1)}
  .cb.done{filter:drop-shadow(0 0 8px var(--green))}
  .cnum{font-family:var(--sans); font-weight:800; font-size:1.3rem; line-height:1; color:var(--green)}
  .cnum small{font-family:var(--sans); font-size:.68rem; color:var(--faint); font-weight:700}
  .clab{font-family:var(--mono); font-size:.54rem; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); font-weight:700; margin-top:.25rem}

  .lab{font-family:var(--mono); font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:.35rem}
  .bots{display:grid; gap:.35rem}
  .bt{display:flex; align-items:center; gap:.5rem; background:var(--panel); border:2px solid var(--bc); border-radius:11px; padding:.35rem .55rem}
  .bt svg{width:22px; height:22px; flex:none} .bt span{font-size:.74rem; font-weight:700}

  .roadmap{display:flex; flex-direction:column; gap:.4rem; min-height:0}
  .roadmap .list{display:flex; flex-direction:column; gap:.4rem; overflow:auto; min-height:0}
  .day{--ac:var(--orange); color:var(--ink); position:relative; display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; cursor:pointer;
    background:linear-gradient(180deg, color-mix(in srgb,var(--ac) 10%, var(--panel)), var(--panel)); border:2px solid color-mix(in srgb,var(--ac) 42%, var(--edge));
    border-radius:13px; padding:.45rem .55rem; transition:transform .12s, box-shadow .2s; outline:none}
  .day:not(.lock):hover{transform:translateX(2px)}
  .day.active{border-color:var(--ac); box-shadow:0 0 0 1px var(--ac), 0 6px 18px color-mix(in srgb,var(--ac) 32%, transparent)}
  .day.lock{opacity:.45; cursor:default; background:var(--panel); border-color:var(--edge)}
  .seal{width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center; font-family:var(--sans); font-weight:800; font-size:.82rem; color:#0a1030;
    background:radial-gradient(circle at 34% 30%, color-mix(in srgb,#fff 34%, var(--ac)), var(--ac) 62%, color-mix(in srgb,var(--ac) 60%,#000) 100%); box-shadow:inset 0 0 0 2px rgba(0,0,0,.15), 0 0 8px color-mix(in srgb,var(--ac) 55%,transparent)}
  .day.lock .seal{background:color-mix(in srgb,var(--faint) 40%, var(--bg)); box-shadow:none; color:color-mix(in srgb,var(--faint) 90%,var(--ink))}
  .dmain{flex:1; min-width:0}
  .dday{font-family:var(--mono); font-size:.54rem; letter-spacing:.08em; text-transform:uppercase; color:var(--soft)}
  .dttl{font-weight:800; font-size:.82rem; line-height:1.1}
  .dttl.veil{color:var(--faint); font-family:var(--mono); font-weight:600; letter-spacing:.02em; font-size:.76rem}
  .dst{font-family:var(--sans); font-weight:800; font-size:.66rem; color:var(--faint); flex:none}
  .day.active .dst,.day.done .dst{color:var(--ac)}

  /* ---------- MAIN ---------- */
  .main{--ac:var(--orange); position:relative; min-height:0; border-radius:20px; overflow:hidden; display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--panel),var(--panel2)); border:3px solid var(--ac);
    box-shadow:0 18px 44px rgba(0,0,0,.5), 0 0 34px color-mix(in srgb,var(--ac) 20%, transparent)}
  .topband{display:flex; align-items:center; justify-content:space-between; padding:.55rem 1.2rem; border-bottom:2px solid color-mix(in srgb,var(--ac) 40%, var(--edge));
    font-family:var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); background:color-mix(in srgb,var(--ac) 16%, transparent); flex:none}
  .topband b{color:var(--ac); font-family:var(--display); letter-spacing:.02em}
  .stage{flex:1; min-height:0; display:flex}

  /* radar (scellé uniquement) */
  .radar{position:relative; aspect-ratio:1; border-radius:50%; flex:none;
    background:radial-gradient(circle, color-mix(in srgb,var(--ac) 14%, transparent), transparent 72%);
    border:2px solid color-mix(in srgb,var(--ac) 45%, transparent); box-shadow:inset 0 0 26px color-mix(in srgb,var(--ac) 14%, transparent), 0 0 22px color-mix(in srgb,var(--ac) 16%, transparent)}
  .radar .ring{position:absolute; border-radius:50%; border:1px solid color-mix(in srgb,var(--ac) 24%, transparent)}
  .radar .r1{inset:16%} .radar .r2{inset:33%} .radar .r3{inset:50%}
  .radar .cx,.radar .cy{position:absolute; background:color-mix(in srgb,var(--ac) 22%, transparent)}
  .radar .cx{left:0; right:0; top:50%; height:1px} .radar .cy{top:0; bottom:0; left:50%; width:1px}
  .radar .sweep{position:absolute; inset:0; border-radius:50%; overflow:hidden}
  .radar .sweep::before{content:""; position:absolute; inset:0; background:conic-gradient(from 0deg, color-mix(in srgb,var(--ac) 55%, transparent), transparent 55deg, transparent); animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .radar .core{position:absolute; inset:0; display:grid; place-items:center}

  .sealed{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.35rem; padding:1.6rem; text-align:center}
  .sealed .radar{width:min(36vh,270px)}
  .bigseal{width:76px; height:76px; border-radius:50%; display:grid; place-items:center; color:#0a1030; font-family:var(--sans); font-weight:800; font-size:1.6rem;
    background:radial-gradient(circle at 34% 30%, color-mix(in srgb,#fff 34%, var(--ac)), var(--ac) 60%, color-mix(in srgb,var(--ac) 58%,#000) 100%); box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.16), 0 0 18px color-mix(in srgb,var(--ac) 50%,transparent)}
  .scode{font-family:var(--display); font-size:1rem; letter-spacing:.02em; color:var(--ac); text-shadow:0 0 12px color-mix(in srgb,var(--ac) 40%,transparent)}
  .smsg{color:var(--soft); font-size:.92rem; max-width:36ch}
  .cstate{max-width:42ch; background:color-mix(in srgb,var(--ac) 9%, transparent); border:1px solid color-mix(in srgb,var(--ac) 32%, transparent); border-radius:11px; padding:.65rem .85rem; font-size:.9rem; color:var(--ink); line-height:1.35}
  .cslab{display:block; font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ac); font-weight:700; margin-bottom:.3rem}
  .env-art{position:relative; margin:.2rem 0 .3rem}
  .env-body{width:min(60vw,240px); aspect-ratio:1.55/1; border-radius:16px; position:relative; overflow:hidden;
    background:linear-gradient(180deg, color-mix(in srgb,var(--ac) 26%, var(--panel)), color-mix(in srgb,var(--ac) 12%, var(--panel)));
    border:3px solid var(--ac); box-shadow:0 14px 32px rgba(0,0,0,.45), 0 0 28px color-mix(in srgb,var(--ac) 24%,transparent)}
  .env-flap{position:absolute; top:0; left:0; right:0; height:58%; clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(160deg, color-mix(in srgb,var(--ac) 42%, var(--panel)), color-mix(in srgb,var(--ac) 20%, var(--panel)))}
  .env-wax{position:absolute; top:53%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px; border-radius:50%; z-index:2;
    display:grid; place-items:center; font-family:var(--sans); font-weight:800; font-size:1.5rem; color:#0a1030;
    background:radial-gradient(circle at 34% 30%, color-mix(in srgb,#fff 34%, var(--ac)), var(--ac) 62%, color-mix(in srgb,var(--ac) 58%,#000) 100%);
    box-shadow:0 5px 12px rgba(0,0,0,.45), inset 0 0 0 3px rgba(0,0,0,.14)}
  .env-spark{position:absolute; color:var(--ac); animation:twinkle 2s ease-in-out infinite; text-shadow:0 0 10px color-mix(in srgb,var(--ac) 60%,transparent)}
  .env-spark.s1{top:-16px; left:-14px; font-size:1.3rem} .env-spark.s2{top:6px; right:-20px; font-size:1.7rem; animation-delay:.5s} .env-spark.s3{bottom:-18px; left:26%; font-size:1rem; animation-delay:1s}
  @keyframes twinkle{0%,100%{opacity:.35; transform:scale(.8)}50%{opacity:1; transform:scale(1.2)}}

  .btn{cursor:pointer; font-family:var(--sans); font-weight:800; font-size:.95rem; letter-spacing:.01em; color:color-mix(in srgb,var(--ac) 62%,#071026);
    background:#fff; border:none; border-radius:12px; padding:.7rem 1.3rem; display:inline-flex; align-items:center; gap:.5rem; box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 32%,#cfd8e8), 0 8px 16px rgba(0,0,0,.28); transition:transform .1s, box-shadow .1s}
  .btn:hover{filter:brightness(1.02)} .btn:active{transform:translateY(3px); box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 32%,#cfd8e8)}
  .btn svg{width:18px; height:18px}

  /* OUVERT : mission principale (compacte) + missions secondaires (large) */
  .opened{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,.68fr) minmax(0,1.32fr)}
  @media (max-width:900px){.opened{grid-template-columns:1fr}}
  .genpane{position:relative; padding:1.3rem 1.4rem; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:.7rem}
  .m-code{font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ac); font-weight:700}
  .m-ttl{font-family:var(--sans); font-weight:800; font-size:clamp(1.4rem,2.5vw,2.05rem); letter-spacing:-.01em; margin:0; line-height:1.08; text-wrap:balance}
  .m-brief{margin:0; color:var(--ink); font-size:.95rem; padding:.85rem .95rem; border:1px solid color-mix(in srgb,var(--ac) 40%,transparent); background:color-mix(in srgb,var(--ac) 9%, transparent); border-radius:12px}
  .m-brief .bl{font-family:var(--sans); font-weight:800; font-size:.72rem; letter-spacing:.02em; color:var(--ac); display:block; margin-bottom:.3rem}
  .matos{font-size:.85rem; color:var(--soft)}
  .matos .mlab{font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:700; display:block; margin-bottom:.3rem}
  .matos ul{margin:0; padding-left:1.05rem; display:flex; flex-direction:column; gap:.22rem}
  .brief-link{align-self:flex-start; text-decoration:none; font-family:var(--sans); font-weight:800; font-size:.85rem; color:color-mix(in srgb,var(--ac) 62%,#071026); background:#fff; border-radius:11px; padding:.55rem 1rem; display:inline-flex; align-items:center; gap:.5rem; box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 32%,#cfd8e8), 0 8px 16px rgba(0,0,0,.28); transition:transform .1s}
  .brief-link:hover{filter:brightness(1.02)} .brief-link:active{transform:translateY(3px); box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 32%,#cfd8e8)}
  .brief-link svg{width:18px; height:18px}
  .genbottom{margin-top:auto; display:flex; flex-direction:column; gap:.7rem; align-items:flex-start}
  .reveal-btn{cursor:pointer; font-family:var(--sans); font-weight:800; font-size:.9rem; color:color-mix(in srgb,var(--ac) 62%,#071026); background:#fff; border:none; border-radius:12px; padding:.7rem 1.2rem; display:inline-flex; align-items:center; gap:.5rem; box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 32%,#cfd8e8), 0 8px 16px rgba(0,0,0,.28); transition:transform .1s, box-shadow .1s}
  .reveal-btn:hover{filter:brightness(1.02)} .reveal-btn:active{transform:translateY(3px); box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 32%,#cfd8e8)}
  .reveal-btn svg{width:18px; height:18px}
  .genfoot{display:flex; align-items:center; gap:.6rem; color:var(--faint); font-size:.78rem}
  .genfoot .star{color:var(--ac); font-size:1.1rem}

  .objpane{border-left:2px solid color-mix(in srgb,var(--ac) 35%, var(--edge)); background:color-mix(in srgb,#000 16%, var(--panel2)); padding:1rem 1rem; min-height:0; display:flex; flex-direction:column}
  .oh{font-family:var(--sans); font-weight:800; font-size:.92rem; letter-spacing:.01em; color:var(--ink); margin-bottom:.7rem; display:flex; align-items:center; gap:.5rem}
  .oh .star{color:var(--ac)} .oh .cnt{font-family:var(--mono); font-size:.66rem; color:var(--ac); margin-left:auto; letter-spacing:.1em}
  .sealpane{border-left:2px solid color-mix(in srgb,var(--ac) 35%, var(--edge)); background:color-mix(in srgb,#000 16%, var(--panel2)); padding:1.2rem; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.1rem; text-align:center}
  .sealpane .radar{width:min(30vh,220px)}
  .veille{font-size:.9rem; color:var(--soft); background:color-mix(in srgb,var(--ink) 5%, transparent); border:1px solid var(--edge); border-radius:10px; padding:.6rem .8rem}
  .veille b{color:var(--ink)}
  @media (max-width:900px){.sealpane{border-left:none; border-top:2px solid var(--edge)}}
  .secs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.5rem; overflow-y:auto; overflow-x:hidden; min-height:0; transition:filter .5s ease, opacity .5s ease}
  .secs.veiled{filter:blur(7px); opacity:.55; pointer-events:none; user-select:none}
  .sec{display:flex; gap:.65rem; align-items:flex-start; padding:.7rem .75rem; border-radius:12px; cursor:pointer;
    background:var(--panel); border:2px solid var(--edge); transition:border-color .15s, box-shadow .15s, transform .1s}
  .sec:hover{border-color:var(--ac)}
  .ck{flex:none; width:1.5rem; height:1.5rem; border-radius:7px; border:2.5px solid var(--edge2); margin-top:.05rem; display:grid; place-items:center; transition:.2s}
  .ck svg{width:.95rem; height:.95rem; opacity:0; transform:scale(.5); transition:.2s}
  .sec.on{border-color:var(--green); background:color-mix(in srgb,var(--green) 13%, var(--panel))}
  .sec.on .ck{background:var(--green); border-color:var(--green)} .sec.on .ck svg{opacity:1; transform:scale(1)}
  .sec.on .snm{opacity:.6; text-decoration:line-through}
  .snm{font-family:var(--mono); font-weight:700; font-size:.78rem; letter-spacing:.01em; color:var(--ink); display:block}
  .sdesc{font-size:.86rem; color:var(--soft); margin-top:.2rem}
  .zn{display:inline-block; margin-top:.4rem; font-family:var(--mono); font-size:.58rem; letter-spacing:.03em; text-transform:uppercase; font-weight:700; padding:.22rem .5rem; border-radius:7px; border:2px solid transparent}
  .zn.pen{color:var(--blue); border-color:color-mix(in srgb,var(--blue) 45%,transparent); background:color-mix(in srgb,var(--blue) 13%, transparent)}
  .zn.box{color:var(--yellow); border-color:color-mix(in srgb,var(--yellow) 45%,transparent); background:color-mix(in srgb,var(--yellow) 13%, transparent)}
  .zn.aff{color:var(--pink); border-color:color-mix(in srgb,var(--pink) 45%,transparent); background:color-mix(in srgb,var(--pink) 13%, transparent)}

  .stamp{position:absolute; top:.7rem; right:1rem; z-index:6; font-family:var(--display); font-size:.8rem; color:var(--green);
    border:2.5px solid var(--green); border-radius:10px; padding:.2rem .6rem; transform:rotate(6deg); opacity:0; transition:.3s; text-shadow:0 0 8px color-mix(in srgb,var(--green) 40%,transparent)}
  .main.complete .stamp{opacity:.95}
  @media (max-width:900px){.objpane{border-left:none; border-top:2px solid var(--edge)}}

  .reset{position:fixed; bottom:.4rem; left:.7rem; z-index:2; background:none; border:none; color:var(--faint); font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; opacity:.5}
  .reset:hover{opacity:1; color:var(--pink)}
  .sound{position:fixed; bottom:1.9rem; left:.7rem; z-index:6; display:inline-flex; align-items:center; gap:.45rem; background:var(--panel); border:2px solid var(--green); color:var(--ink); border-radius:100px; padding:.45rem .85rem .45rem .7rem; font-family:var(--sans); font-weight:800; font-size:.78rem; cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,.45); transition:filter .2s}
  .sound:hover{filter:brightness(1.08)}
  .sound svg{width:16px; height:16px; fill:currentColor}
  .sound.off{border-color:var(--pink); color:var(--pink); animation:sndpulse 1.8s ease-in-out infinite}
  @keyframes sndpulse{0%,100%{box-shadow:0 3px 12px rgba(0,0,0,.45)}50%{box-shadow:0 3px 12px rgba(0,0,0,.45), 0 0 0 5px color-mix(in srgb,var(--pink) 25%, transparent)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--yellow)"/><stop offset="1" stop-color="var(--green)"/></linearGradient>
  <clipPath id="fc"><rect id="fr" x="0" y="105" width="80" height="0"/></clipPath>
</defs></svg>

<div class="app">
  <div class="topbar"><div class="topbar-in">
    <div class="bhead">
      <div class="classif"><span class="dot"></span> Confidentiel · WikiYouthBot</div>
      <div class="eyebrow">Votre mission, si vous l'acceptez</div>
      <h1 class="bigmission">Transformer votre chatbot en expert de votre cause</h1>
    </div>
    <div class="charge">
      <svg class="cb" viewBox="0 0 80 105" aria-label="Charge du chatbot">
        <g class="ghost"><line x1="40" y1="20" x2="40" y2="9"/><circle cx="40" cy="6" r="3"/>
          <rect class="body" x="12" y="20" width="56" height="62" rx="16"/><rect class="scr" x="22" y="32" width="36" height="22" rx="6"/>
          <circle class="eye" cx="32" cy="43" r="3.6"/><circle class="eye" cx="48" cy="43" r="3.6"/>
          <rect class="lim" x="24" y="84" width="13" height="9" rx="3.5"/><rect class="lim" x="43" y="84" width="13" height="9" rx="3.5"/></g>
        <g class="full" clip-path="url(#fc)"><circle class="lim" cx="40" cy="6" r="3"/><line x1="40" y1="20" x2="40" y2="9" class="mo"/>
          <rect class="body" x="12" y="20" width="56" height="62" rx="16"/><rect class="scr" x="22" y="32" width="36" height="22" rx="6"/>
          <circle class="eye" cx="32" cy="43" r="3.6"/><circle class="eye" cx="48" cy="43" r="3.6"/><path class="mo" d="M30 61 q10 7 20 0"/>
          <rect class="lim" x="24" y="84" width="13" height="9" rx="3.5"/><rect class="lim" x="43" y="84" width="13" height="9" rx="3.5"/></g>
      </svg>
      <div><div class="cnum"><span id="pn">0</span> <small>/ <span id="ptot">16</span></small></div><div class="clab" id="clab">unité en veille</div></div>
    </div>
  </div></div>
  <div class="neon-sep"></div>
  <div class="stage-wrap"><div class="content">
    <aside class="side">
      <div><div class="lab">Trois équipes en opération</div><div class="bots" id="bots"></div></div>
      <div class="roadmap"><div class="lab">Feuille de route</div><div class="list" id="daylist"></div></div>
    </aside>
    <main class="main" id="main"></main>
  </div></div>
</div>
<button class="reset" id="reset">Réinitialiser</button>
<button class="sound" id="soundBtn" aria-label="Son d'ambiance"></button>

<div class="celebrate" id="celebrate">
  <div class="cele-card" id="celeCard">
    <div id="celeIcon"></div>
    <div class="big" id="celeBig"></div>
    <div class="sub" id="celeSub"></div>
    <button class="btn" id="celeClose">Continuer</button>
  </div>
</div>

<script>
  const ZLAB={pen:"à écrire · Instructions",box:"à déposer · Contexte",aff:"créer l'affiche de diffusion du chatbot"};
  const IC_ENV=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>`;
  const IC_EYE=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>`;
  const IC_ARROW=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg>`;
  const CHK=`<svg viewBox="0 0 24 24" fill="none" stroke="#0a2b12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const bot=c=>`<svg viewBox="0 0 64 64"><line x1="32" y1="14" x2="32" y2="6" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="5" r="3.5" fill="${c}"/><rect x="14" y="14" width="36" height="30" rx="10" fill="${c}"/><rect x="20" y="20" width="24" height="15" rx="6" fill="#06122e"/><circle cx="27" cy="27.5" r="3.2" fill="#eafff2"/><circle cx="37" cy="27.5" r="3.2" fill="#eafff2"/><rect x="24" y="46" width="16" height="7" rx="3" fill="${c}"/></svg>`;
  const RADAR=`<div class="radar"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="cx"></div><div class="cy"></div><div class="sweep"></div><div class="core">%C%</div></div>`;

  const BOTS=[{nm:"Feux de forêt",c:"#f37030"},{nm:"Récifs coralliens",c:"#38b6ff"},{nm:"Harcèlement à l'école",c:"#9b6cff"}];

  const ENV=[
    {id:"mar",day:"Mardi",code:"Mission 01",n:1,ac:"var(--orange)",title:"Le cœur et les sources",link:"conference-de-presse-ia.html",linkLabel:"Ouvrir la conférence de presse",
     mission:"Tester la réaction de votre chatbot face aux rumeurs et aux fake news.",
     material:["Un ordinateur par équipe","Un dispositif vocal","Les cahiers de prise de note"],
     secs:[{name:"IDENTITÉ",desc:"Donnez-lui un nom, un slogan et sa mission en une phrase.",tip:"Si votre chatbot était une personne, comment se présenterait-il en une phrase ?",zone:"pen"},
           {name:"THÉMATIQUE",desc:"Écrivez votre cause et le lieu précis qu'elle concerne : quartier, ville.",tip:"De quoi parle-t-il exactement, et de quel endroit précis ?",zone:"pen"},
           {name:"RÈGLES DE COMPORTEMENT",desc:"Fixez 2 ou 3 règles : ce qu'il fait toujours, ce qu'il ne fait jamais.",tip:"Comment transformer une bonne pratique en une règle courte et claire ?",zone:"pen"},
           {name:"EXIGENCES DE QUALITÉ",desc:"Exigez des chiffres datés, des noms d'acteurs et des lieux précis.",tip:"Qu'est-ce qui rendrait sa réponse vraiment précise plutôt que vague ?",zone:"pen"}]},
    {id:"mer",day:"Mercredi",code:"Mission 02",n:2,ac:"var(--blue)",title:"Les oreilles et la voix",
     mission:"Rendre votre chatbot utile : savoir à qui il parle, et quelles questions on lui posera.",
     material:["Les cartes-personas","Les fiches questions-réponses","Un ordinateur avec le chatbot"],
     secs:[{name:"QUI SONT VOS PERSONAS",desc:"Donnez à chacun un prénom, un âge et une situation.",tip:"Ces personnes existent-elles vraiment dans votre quartier ?",zone:"box"},
           {name:"CE QU'ILS CHERCHENT",desc:"Notez ce que chaque persona vient demander au chatbot.",tip:"Pourquoi cette personne ouvrirait-elle votre chatbot ?",zone:"box"},
           {name:"LE TON POUR CHACUN",desc:"Décidez comment le chatbot parle à chaque persona.",tip:"Parle-t-il pareil à un enfant et à un élu ?",zone:"box"},
           {name:"QUESTIONS-RÉPONSES DE RÉFÉRENCE",desc:"Écrivez vos questions types et la réponse de référence à chacune.",tip:"Quelles questions reviendront le plus souvent ?",zone:"box"}]},
    {id:"jeu",day:"Jeudi",code:"Mission 03",n:3,ac:"var(--pink)",title:"La mémoire",
     link:"bristols-donnees-cles.html",linkLabel:"Ouvrir les bristols de données",
     mission:"Donner à votre chatbot les données locales qui lui manquent : chiffres, acteurs, lieux, gestes, trouvés en ligne ou récoltés autour de vous.",
     material:["Les bristols de données, une couleur par type","De quoi mesurer selon votre sujet","Un ordinateur avec le chatbot"],
     secs:[{name:"LE CHIFFRE",desc:"Un chiffre daté et sourcé, ou une mesure que vous prenez vous-mêmes.",tip:"L'as-tu trouvé à une source fiable, ou mesuré toi-même ?",zone:"box"},
           {name:"L'ACTEUR",desc:"Une personne ou une structure réelle, son rôle, ce qu'elle fait.",tip:"Qui, près de chez vous, connaît vraiment ce sujet ?",zone:"box"},
           {name:"LE LIEU OU LE FAIT",desc:"Un endroit ou un événement précis et local.",tip:"Qu'est-ce qui rend ce lieu ou ce fait précis, et pas général ?",zone:"box"},
           {name:"LE GESTE UTILE",desc:"Une action concrète, un dispositif, un contact utile.",tip:"Que peut faire concrètement quelqu'un qui veut aider ?",zone:"box"}]},
    {id:"ven",day:"Vendredi",code:"Mission 04",n:4,ac:"var(--yellow)",title:"La personnalité",
     mission:"Donner à votre chatbot sa personnalité et ses limites, puis le présenter.",
     material:["Le matériel créatif pour la mascotte","Un support pour l'affiche","Le QR code du chatbot","Un ordinateur avec le chatbot"],
     secs:[{name:"PERSONNALITÉ ET TON",desc:"Donnez-lui un ton et une manière de parler.",tip:"Sérieux, drôle, militant ? Tutoie-t-il ou vouvoie-t-il ?",zone:"pen"},
           {name:"LA MASCOTTE",desc:"Dessinez sa mascotte, puis déposez-la.",tip:"Quel personnage résume votre chatbot en un coup d'œil ?",zone:"box"},
           {name:"INTERDITS ET LIGNES ROUGES",desc:"Listez ce qu'il ne dira jamais, quoi qu'on lui demande.",tip:"Quelles réponses seraient injustes, blessantes ou fausses ?",zone:"pen"},
           {name:"LA FICHE D'IDENTITÉ",desc:"Rassemblez son identité et son QR code sur l'affiche de diffusion.",tip:"Que doit voir un passant pour avoir envie de scanner le QR code ?",zone:"aff"}]}
  ];

  const STATES=[
    "Thématique choisie au bingo. Votre chatbot démarre tout neuf, prêt à être spécialisé.",
    "Il porte désormais une cause et s'appuie sur de vraies sources plutôt que sur des rumeurs.",
    "Il sait maintenant à qui il parle, et tient ses réponses de référence prêtes.",
    "Il puise désormais dans une mémoire de vraies données locales, chiffres, acteurs, lieux, gestes.",
    "Chatbot complet : une vraie personnalité, des limites claires, prêt à être présenté."
  ];
  const KEY="wyb-mission-file-v4";
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
  const save=s=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
  let st=load();
  if(!st.env){st.env={}; ENV.forEach(e=>st.env[e.id]={open:false,secs:e.secs.map(()=>false)});}
  const done=e=>st.env[e.id].secs.every(Boolean);
  const unlocked=i=> i===0 || done(ENV[i-1]);
  if(!st.active){const f=ENV.find(e=>!done(e)); st.active=f?f.id:ENV[ENV.length-1].id;}

  document.getElementById("bots").innerHTML=BOTS.map(b=>`<div class="bt" style="--bc:${b.c}">${bot(b.c)}<span>${b.nm}</span></div>`).join("");
  const main=document.getElementById("main"), daylist=document.getElementById("daylist");
  const radar=c=>RADAR.replace("%C%",c);

  function renderMain(){
    const e=ENV.find(x=>x.id===st.active), s=st.env[e.id];
    const gTot=ENV.reduce((a,x)=>a+x.secs.length,0), gN=ENV.reduce((a,x)=>a+st.env[x.id].secs.filter(Boolean).length,0), glab=gN===0?"en veille":gN===gTot?"opérationnel":"en charge";
    const compM=ENV.filter(x=>done(x)).length;
    main.style.setProperty("--ac",e.ac);
    main.className="main"+(done(e)?" complete":"");
    let h=`<div class="topband"><span>Dossier <b>${e.code}</b></span><span>${e.day}</span></div><div class="stage">`;
    if(!s.open){
      h+=`<div class="opened">
        <div class="genpane"><div class="m-code">${e.day} · ${e.code}</div><h2 class="m-ttl">Enveloppe scellée</h2>
          <div class="cstate"><span class="cslab">Débrief · votre chatbot · ${gN}/${gTot} · ${glab}</span>${STATES[compM]}</div>
          <div class="veille">${compM>0?`Hier, vous avez bouclé <b>${ENV[compM-1].code} · ${ENV[compM-1].title}</b>.`:"Première enveloppe de la semaine."}</div>
          <div class="genfoot"><span class="star">✦</span> Descellez pour découvrir le briefing du jour.</div></div>
        <aside class="sealpane">${radar(`<div class="bigseal">${e.n}</div>`)}
          <div class="scode">${e.code} · ${e.day}</div>
          <button class="btn" data-open="${e.id}">${IC_ENV}Desceller l'enveloppe</button></aside>
      </div>`;
    } else {
      const rows=e.secs.map((x,i)=>`<li class="sec${s.secs[i]?" on":""}" data-i="${i}"><span class="ck">${CHK}</span>
        <span class="sbody"><span class="snm">${x.name}</span><span class="sdesc">${x.desc}</span>
        ${x.tip?`<div class="stip">${x.tip}</div>`:""}
        <span class="zn ${x.zone}">${ZLAB[x.zone]||x.zone}</span></span></li>`).join("");
      const n=s.secs.filter(Boolean).length;
      h+=`<div class="opened">
        <div class="genpane"><div class="m-code">${e.day} · ${e.code}</div><h2 class="m-ttl">${e.title}</h2>
          <p class="m-brief"><span class="bl">★ Briefing</span>${e.mission}</p>
          ${e.material?`<div class="matos"><span class="mlab">Matériel de mission</span><ul>${e.material.map(m=>`<li>${m}</li>`).join("")}</ul></div>`:""}
          ${e.link&&s.revealed?`<a class="brief-link" href="${e.link}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>${e.linkLabel}</a>`:""}
          <div class="genbottom">
            ${s.revealed?"":`<button class="reveal-btn" data-reveal="${e.id}">${IC_EYE}Révéler les instructions</button>`}
            <div class="genfoot"><span class="star">★</span> ${n} instruction${n>1?"s":""} sur ${e.secs.length} remplie${n>1?"s":""}</div>
          </div></div>
        <aside class="objpane"><div class="oh"><span class="star">✦</span> Instructions <span class="cnt">${n}/${e.secs.length}</span></div><ul class="secs${s.revealed?"":" veiled"}">${rows}</ul></aside>
      </div>`;
    }
    h+=`</div>`; main.innerHTML=h;
  }

  function renderDays(){
    daylist.innerHTML="";
    ENV.forEach((e,i)=>{
      const s=st.env[e.id], nd=done(e), lk=!unlocked(i), n=s.secs.filter(Boolean).length, reveal=s.open||nd;
      const el=document.createElement("button");
      el.className="day"+(st.active===e.id?" active":"")+(nd?" done":"")+(lk?" lock":"");
      el.style.setProperty("--ac",e.ac);
      const ttl = reveal ? `<div class="dttl">${e.title}</div>` : `<div class="dttl veil">Enveloppe scellée</div>`;
      el.innerHTML=`<div class="seal">${lk?"&#9679;":nd?"★":e.n}</div>
        <div class="dmain"><div class="dday">${e.day} · ${e.code}</div>${ttl}</div>
        <div class="dst">${nd?"OK":lk?"—":s.open?n+"/"+e.secs.length:""}</div>`;
      if(!lk) el.addEventListener("click",()=>{st.active=e.id; save(st); render();});
      daylist.appendChild(el);
    });
  }

  function render(){
    renderMain(); renderDays();
    const tot=ENV.reduce((a,e)=>a+e.secs.length,0), n=ENV.reduce((a,e)=>a+st.env[e.id].secs.filter(Boolean).length,0);
    document.getElementById("pn").textContent=n; document.getElementById("ptot").textContent=tot;
    const f=n/tot, H=105, r=document.getElementById("fr");
    r.setAttribute("y",(H*(1-f)).toFixed(1)); r.setAttribute("height",(H*f).toFixed(1));
    document.querySelector(".cb").classList.toggle("done",n===tot);
    document.getElementById("clab").textContent = n===0?"unité en veille" : n===tot?"unité opérationnelle" : "unité en charge";
  }

  const CCOL=["#f37030","#38b6ff","#fa89d2","#f9c724","#7ed957","#9b6cff"];
  const ROBOT=`<svg width="60" height="80" viewBox="0 0 80 105" aria-hidden="true"><circle cx="40" cy="6" r="3" fill="#7ed957"/><line x1="40" y1="20" x2="40" y2="9" stroke="#7ed957" stroke-width="3" stroke-linecap="round"/><rect x="12" y="20" width="56" height="62" rx="16" fill="#7ed957"/><rect x="22" y="32" width="36" height="22" rx="6" fill="#06122e"/><circle cx="32" cy="43" r="3.6" fill="#eafff2"/><circle cx="48" cy="43" r="3.6" fill="#eafff2"/><path d="M30 61 q10 7 20 0" stroke="#06122e" stroke-width="2.4" fill="none"/><rect x="24" y="84" width="13" height="9" rx="3.5" fill="#7ed957"/><rect x="43" y="84" width="13" height="9" rx="3.5" fill="#7ed957"/></svg>`;
  function celebrate(opts){
    const el=document.getElementById("celebrate"), card=document.getElementById("celeCard");
    const fin=!!opts.final, ac=fin?"var(--green)":opts.env.ac;
    card.style.setProperty("--ac",ac);
    document.getElementById("celeIcon").innerHTML = "";
    document.getElementById("celeBig").textContent = fin?"Mission de labo terminée":(opts.env.code+" terminée");
    document.getElementById("celeSub").textContent = fin?"Votre chatbot est prêt. Bravo à toute l'équipe.":"Bien joué. L'enveloppe suivante se descelle.";
    document.getElementById("celeClose").innerHTML = IC_ARROW + (fin?"Revenir aux fiches missions":"Continuer");
    el.querySelectorAll(".confetti").forEach(c=>c.remove());
    const N=fin?84:46;
    for(let i=0;i<N;i++){
      const c=document.createElement("div"); c.className="confetti";
      c.style.left=(Math.random()*100)+"%";
      c.innerHTML=bot(CCOL[i%CCOL.length]);
      c.style.animationDuration=(1.1+Math.random()*1.4)+"s";
      c.style.animationDelay=(Math.random()*.5)+"s";
      c.style.transform="translateY(-20px) rotate("+(Math.random()*360)+"deg)";
      el.appendChild(c);
    }
    el.classList.add("show");
  }
  document.getElementById("celeClose").addEventListener("click",()=>{
    document.getElementById("celebrate").classList.remove("show");
    const cur=ENV.findIndex(e=>e.id===st.active);
    for(let i=cur+1;i<ENV.length;i++){ if(unlocked(i) && !done(ENV[i])){ st.active=ENV[i].id; break; } }
    save(st); render();
  });

  main.addEventListener("click",e=>{
    const ob=e.target.closest("[data-open]");
    if(ob){st.env[ob.dataset.open].open=true; save(st); render(); return;}
    const rb=e.target.closest("[data-reveal]");
    if(rb){ st.env[rb.dataset.reveal].revealed=true; save(st); render(); return; }
    const sec=e.target.closest(".sec");
    if(sec){
      const i=+sec.dataset.i, a=st.active, e=ENV.find(x=>x.id===a);
      st.env[a].secs[i]=!st.env[a].secs[i];
      let party=null;
      if(!st.env[a].celebrated && done(e)){
        st.env[a].celebrated=true;
        const gTot=ENV.reduce((x,y)=>x+y.secs.length,0), gN=ENV.reduce((x,y)=>x+st.env[y.id].secs.filter(Boolean).length,0);
        if(gN===gTot && !st.celebrated){ st.celebrated=true; party={final:true}; } else party={env:e};
      }
      save(st); render();
      if(party) celebrate(party);
    }
  });
  document.getElementById("reset").addEventListener("click",()=>{st={env:{},active:ENV[0].id}; ENV.forEach(e=>st.env[e.id]={open:false,secs:e.secs.map(()=>false)}); save(st); render();});

  // --- ambiance sonore mission (Web Audio, en boucle, modulée) ---
  const SKEY="wyb-sound"; let audioCtx=null, ambient=null;
  let soundOn = (()=>{try{return localStorage.getItem(SKEY)==="on"}catch(e){return false}})();
  const SND_ON=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.6 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const SND_OFF=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9z"/><line x1="16" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="22" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const soundBtn=document.getElementById("soundBtn");
  function updSound(){ soundBtn.classList.toggle("off",!soundOn); soundBtn.innerHTML=(soundOn?SND_ON:SND_OFF)+"<span>"+(soundOn?"Son actif":"Activer le son")+"</span>"; }
  function startAmbient(){
    if(ambient||!soundOn) return;
    try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t0=audioCtx.currentTime, run=[];
    const master=audioCtx.createGain(); master.gain.setValueAtTime(0.0001,t0);
    const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    if(panner){ master.connect(panner); panner.connect(audioCtx.destination); } else { master.connect(audioCtx.destination); }
    master.gain.exponentialRampToValueAtTime(0.22,t0+2);
    const lp=audioCtx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1000; lp.Q.value=0.6; lp.connect(master);
    // modulation du filtre : timbre évolutif (deux vitesses)
    const fA=audioCtx.createOscillator(); fA.type="sine"; fA.frequency.value=0.06; const fAg=audioCtx.createGain(); fAg.gain.value=430; fA.connect(fAg); fAg.connect(lp.frequency); fA.start(); run.push(fA);
    const fB=audioCtx.createOscillator(); fB.type="sine"; fB.frequency.value=0.23; const fBg=audioCtx.createGain(); fBg.gain.value=140; fB.connect(fBg); fBg.connect(lp.frequency); fB.start(); run.push(fB);
    // vibrato lent partagé (mouvement de hauteur)
    const vib=audioCtx.createOscillator(); vib.type="sine"; vib.frequency.value=0.17; const vibG=audioCtx.createGain(); vibG.gain.value=6; vib.connect(vibG); vib.start(); run.push(vib);
    // nappe : accord doux
    [130.81,196.00,261.63].forEach((f,i)=>{const o=audioCtx.createOscillator();o.type=(i===2?"sine":"triangle");o.frequency.value=f;vibG.connect(o.detune);const g=audioCtx.createGain();g.gain.value=[0.16,0.13,0.1][i];o.connect(g);g.connect(lp);o.start();run.push(o);});
    // respiration du volume
    const bl=audioCtx.createOscillator(); bl.type="sine"; bl.frequency.value=0.09; const blG=audioCtx.createGain(); blG.gain.value=0.05; bl.connect(blG); blG.connect(master.gain); bl.start(); run.push(bl);
    // dérive stéréo lente
    if(panner){ const pn=audioCtx.createOscillator(); pn.type="sine"; pn.frequency.value=0.04; const pG=audioCtx.createGain(); pG.gain.value=0.55; pn.connect(pG); pG.connect(panner.pan); pn.start(); run.push(pn); }
    // écho type sonar
    const delay=audioCtx.createDelay(1.0); delay.delayTime.value=0.34; const fb=audioCtx.createGain(); fb.gain.value=0.46; delay.connect(fb); fb.connect(delay); const echoBP=audioCtx.createBiquadFilter(); echoBP.type="bandpass"; echoBP.frequency.value=1050; echoBP.Q.value=3; delay.connect(echoBP); echoBP.connect(master);
    // ping radar régulier, synchronisé au balayage (~3 s)
    const ping=()=>{ if(!ambient) return; const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=1040; const g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.085,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+0.9); o.connect(g); g.connect(master); g.connect(delay); o.start(t); o.stop(t+0.95); };
    ping();
    const timer=setInterval(()=>{ if(soundOn) ping(); }, 3000);
    ambient={master,run,timer};
  }
  function stopAmbient(){
    if(!ambient) return; const a=ambient; ambient=null; clearInterval(a.timer);
    try{ const t=audioCtx.currentTime; a.master.gain.cancelScheduledValues(t); a.master.gain.setValueAtTime(a.master.gain.value,t); a.master.gain.exponentialRampToValueAtTime(0.0001,t+0.5);}catch(e){}
    setTimeout(()=>{ a.run.forEach(n=>{try{n.stop()}catch(e){}}); }, 600);
  }
  soundBtn.addEventListener("click",ev=>{ ev.stopPropagation(); soundOn=!soundOn; try{localStorage.setItem(SKEY,soundOn?"on":"off")}catch(e){} updSound(); if(soundOn) startAmbient(); else stopAmbient(); });
  document.addEventListener("pointerdown",()=>{ if(soundOn) startAmbient(); },{once:true});
  updSound();

  render();
</script>
</body>
</html>
